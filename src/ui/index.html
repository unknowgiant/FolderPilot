<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fmp-token" content="__FMP_TOKEN__">
<meta name="fmp-title" content="__FMP_TITLE__">
<meta name="fmp-version" content="__FMP_VERSION__">
<meta name="fmp-data-dir" content="__FMP_DATA_DIR__">
<title>__FMP_TITLE__</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<!-- 主题皮肤：由 src/tools/gen_skins.py 生成，须在 app.css 之后加载才能覆盖变量 -->
<link rel="stylesheet" href="skin-themes.css">
</head>
<body>

  <symbol id="ic-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></symbol>
  <symbol id="ic-audio" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>

<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◆</span><span class="brand-txt">文件管理多面手</span><span class="brand-ver">__FMP_VERSION__</span></div>
    <div class="layout-switch" id="layout-switch" title="窗格布局 (Ctrl+1~5)"></div>
    <div class="top-spacer"></div>
    <button class="tbtn primary" id="btn-global-search" title="全盘搜索 (Ctrl+F / Alt+Space)"><svg class="i"><use href="#ic-search"/></svg><span>全盘搜索</span></button>
    <button class="tbtn" id="btn-tray" title="暂存盘"><svg class="i"><use href="#ic-tray"/></svg><span id="tray-count">0</span></button>
    <button class="tbtn" id="btn-theme" title="界面皮肤"><svg class="i"><use href="#ic-palette"/></svg></button>
    <button class="tbtn" id="btn-settings" title="设置"><svg class="i"><use href="#ic-settings"/></svg></button>
    <button class="tbtn" id="btn-about" title="关于"><svg class="i"><use href="#ic-info"/></svg></button>
  </header>

  <div class="workarea" id="workarea">
    <aside id="sidebar" class="sidebar">
      <div class="side-scroll" id="side-scroll"></div>
      <div class="side-foot"><button class="sbtn" id="btn-pin" title="固定当前目录"><svg class="i"><use href="#ic-star"/></svg> 固定当前目录</button></div>
    </aside>
    <div class="splitter" id="splitter" title="拖动调整侧栏宽度"></div>
    <main id="panes" class="panes lay-2"></main>
    <div class="pane-split hidden" id="pane-split" title="拖动调整左右窗格宽度；双击恢复均分"></div>
  </div>

  <footer class="statusbar">
    <span id="st-backend" class="st-item clickable" title="点击重新连接 Everything">检测中…</span>
    <span class="st-sep"></span>
    <span id="st-main" class="st-item grow">就绪</span>
    <span id="st-sel" class="st-item"></span>
  </footer>
</div>

<!-- 全盘搜索命令面板 -->
<div id="palette" class="overlay hidden">
  <div class="pal-card">
    <div class="pal-top">
      <svg class="i"><use href="#ic-search"/></svg>
      <input id="pal-input" placeholder="全盘搜索：文件名 / 路径，支持通配符与 ext: 语法" spellcheck="false" autocomplete="off">
      <button class="navbtn" id="pal-filter" title="高级筛选"><svg class="i"><use href="#ic-filter"/></svg></button>
      <button class="navbtn" id="pal-close" title="关闭 (Esc)"><svg class="i"><use href="#ic-x"/></svg></button>
    </div>
    <div class="pal-scope">
      <div class="chips" id="pal-scope-chips">
        <button class="chip on" data-scope="global">全盘</button>
        <button class="chip" data-scope="folder">当前文件夹及子目录</button>
      </div>
      <span class="pal-stat" id="pal-stat">输入关键字开始搜索</span>
    </div>
    <div id="pal-adv" class="pal-adv hidden">
      <label>类型 <input id="pal-ext" placeholder="如 doc;pdf;xlsx"></label>
      <label>最小(字节) <input id="pal-smin" type="number" min="0" placeholder="不限"></label>
      <label>最大(字节) <input id="pal-smax" type="number" min="0" placeholder="不限"></label>
      <label class="ck"><input type="checkbox" id="pal-case"> 区分大小写</label>
      <label class="ck"><input type="checkbox" id="pal-word"> 全字匹配</label>
      <label class="ck"><input type="checkbox" id="pal-content"> 搜索文件内容</label>
    </div>
    <div id="pal-res" class="pal-res"></div>
    <div class="pal-hint">↑↓ 选择 · Enter 打开 · Ctrl+Enter 定位所在目录 · 右键更多操作 · Esc 关闭</div>
  </div>
</div>

<!-- 右侧抽屉：预览 / 暂存盘 -->
<div id="drawer" class="drawer hidden"><div class="drawer-head"><span id="drawer-title">预览</span><button class="navbtn" id="drawer-close"><svg class="i"><use href="#ic-x"/></svg></button></div><div id="drawer-body" class="drawer-body"></div></div>

<div id="ctx" class="ctx hidden"></div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>
<div id="tasks" class="tasks"></div>
<div id="drag-badge" class="drag-badge hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
